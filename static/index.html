<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AILeash - AI Action Firewall</title>

<style>
body{
  margin:0;
  background:#080808;
  color:#ccc;
  font-family:'Courier New', monospace;
}

/* simple layout wrapper */
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:60px 20px;
  text-align:center;
}

h1{
  color:#fff;
  font-size:2.5rem;
  margin-bottom:10px;
}

h1 span{color:#00ff88;}

p{color:#444;max-width:600px;margin:0 auto 20px;}

.box{
  margin-top:40px;
  background:#0c0c0c;
  border:1px solid #1a1a1a;
  padding:20px;
  display:inline-block;
  min-width:320px;
}

input{
  width:100%;
  padding:10px;
  background:#111;
  border:1px solid #222;
  color:#fff;
  margin-bottom:10px;
  font-family:inherit;
}

button{
  width:100%;
  padding:10px;
  background:#00ff88;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#00dd77;}

pre{
  margin-top:15px;
  text-align:left;
  color:#00ff88;
  font-size:12px;
  white-space:pre-wrap;
}
.error{color:#ff4444;}
</style>
</head>

<body>

<div class="wrap">

  <h1>AI<span>Leash</span></h1>

  <p>
    AI governance firewall. Score, block, and audit AI actions in real time.
  </p>

  <div class="box">
    <input id="email" type="email" placeholder="Enter email to get API key">
    <button onclick="signup()">Get API Key</button>

    <pre id="output"></pre>
  </div>

</div>

<script>
async function signup() {
  const email = document.getElementById("email").value;
  const output = document.getElementById("output");

  output.innerText = "Creating key...";

  try {
    const res = await fetch("/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (!res.ok) {
      output.innerHTML = "<span class='error'>" + (data.error || "Error") + "</span>";
      return;
    }

    output.innerText =
`API KEY CREATED:

${data.api_key}

PLAN: ${data.plan}
LIMIT: ${data.limit}`;

  } catch (err) {
    output.innerHTML = "<span class='error'>Network error</span>";
  }
}
</script>

</body>
</html>
