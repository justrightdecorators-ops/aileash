name: Site checks

# Runs on every push. If anything here fails, GitHub emails you and the
# commit gets a red cross - so you hear about a broken module from GitHub,
# not from a customer. It never touches the live site or its database.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the server installs
        run: pip install -r requirements.txt

      - name: Every file the server runs must compile
        run: |
          python3 -m py_compile server.py modules/*.py
          echo "server.py and every module compile cleanly"

      - name: Customer download files compile (warning only)
        continue-on-error: true
        run: |
          bad=0
          for f in *.py; do
            [ "$f" = "server.py" ] && continue
            python3 -m py_compile "$f" || { echo "::warning file=$f::$f does not compile"; bad=1; }
          done
          exit $bad

      - name: Developers page route index matches the modules (warning only)
        continue-on-error: true
        run: |
          python3 .github/scripts/route_index.py --check || echo "::warning file=developers.html::Route index is out of date - run python3 .github/scripts/route_index.py"

      - name: Attack tests
        run: |
          failed=0
          for t in tests/*.py; do
            echo "== $t"
            PYTHONPATH=modules timeout 300 python3 "$t" > /tmp/out.txt 2>&1 || { failed=1; echo "::error file=$t::$t failed"; }
            tail -4 /tmp/out.txt
          done
          exit $failed

      - name: Boot the site with no outside network and check every page
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/boot_check.py

      - name: Machine-proof report end to end (no outside network)
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/dossier_check.py

      - name: Human Keys end to end (no outside network)
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/humankeys_check.py

      - name: Connect, build and homepage strip end to end (no outside network)
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/connect_check.py

      - name: MCP connector end to end (no outside network)
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/mcp_check.py

      - name: AI news ticker and terms page end to end (no outside network)
        run: |
          sudo -E env "PATH=$PATH" unshare -n "$(which python3)" .github/scripts/ainews_check.py
