name: Publish to MCP Registry

# Manual only. Needs one repo secret: MCP_REGISTRY_PRIVATE_KEY (Ed25519 hex).
# It arms sebbi.pro and waits for the domain proof itself, so you just run it.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (prebuilt binary)
        run: |
          set -e
          curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest -o rel.json
          echo "latest tag: $(jq -r .tag_name rel.json)"
          URL=$(jq -r '.assets[].browser_download_url
                       | select(test("(?i)(linux).*(amd64|x86_64)"))' rel.json \
                | grep -ivE 'sha256|checksums|\.sig' | head -1)
          echo "asset: $URL"
          if [ -z "$URL" ]; then echo "no linux asset found"; jq -r '.assets[].name' rel.json; exit 1; fi
          curl -fsSL "$URL" -o pub.download
          mkdir -p binout
          if file pub.download | grep -qi 'gzip\|tar'; then
            tar -xzf pub.download -C binout || tar -xf pub.download -C binout
          else
            cp pub.download binout/mcp-publisher
          fi
          BIN=$(find binout -type f -name 'mcp-publisher*' | head -1)
          [ -z "$BIN" ] && BIN=$(find binout -type f -perm -u+x | head -1)
          [ -z "$BIN" ] && BIN=$(find binout -type f | head -1)
          echo "binary: $BIN"
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/mcp-publisher
          mcp-publisher --help 2>&1 | head -3 || true

      - name: Arm sebbi.pro and wait for the domain proof
        run: |
          echo "arming..."
          curl -fsS "https://sebbi.pro/x/arm/status" -o arm.json || echo "arm call returned non-200 (continuing)"
          head -c 200 arm.json 2>/dev/null; echo
          ok=
          for i in $(seq 1 12); do
            body=$(curl -fsS "https://sebbi.pro/.well-known/mcp-registry-auth" || true)
            echo "proof try $i: $body"
            if echo "$body" | grep -q "v=MCPv1"; then ok=1; break; fi
            # re-arm and wait, in case a deploy was still rolling
            curl -fsS "https://sebbi.pro/x/arm/status" -o /dev/null || true
            sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::domain proof never came live at https://sebbi.pro/.well-known/mcp-registry-auth"; exit 1; fi
          echo "proof is live."

      - name: Build server.json
        run: |
          set -e
          jq -n '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: "pro.sebbi/governance",
            title: "sebbi.pro - seal every AI decision",
            description: "Score, seal and prove any AI decision, timestamped into Bitcoin - checkable by anyone.",
            version: "1.0.0",
            remotes: [ { type: "streamable-http", url: "https://sebbi.pro/mcp" } ]
          }' > server.json
          echo "----- server.json -----"; cat server.json

      - name: Log in (domain HTTP auth)
        run: |
          set +e
          mcp-publisher login http --domain=sebbi.pro --private-key="${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}" 2>&1 | tee login.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::login failed (exit $code)"
            tail -n 25 login.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi

      - name: Publish
        run: |
          set +e
          mcp-publisher publish 2>&1 | tee pub.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::publish failed (exit $code)"
            tail -n 25 pub.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi
