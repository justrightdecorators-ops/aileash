name: Publish to MCP Registry

# Manual only. Run it from the Actions tab after the site is deployed and armed,
# so https://sebbi.pro/.well-known/mcp-registry-auth is live for the check.
# Needs one repo secret: MCP_REGISTRY_PRIVATE_KEY (the Ed25519 private key hex).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (prebuilt binary)
        run: |
          set -e
          curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest -o rel.json
          echo "latest tag: $(jq -r .tag_name rel.json)"
          URL=$(jq -r '.assets[].browser_download_url
                       | select(test("(?i)(linux).*(amd64|x86_64)"))' rel.json \
                | grep -ivE 'sha256|checksums|\.sig' | head -1)
          echo "asset: $URL"
          if [ -z "$URL" ]; then echo "no linux asset found"; jq -r '.assets[].name' rel.json; exit 1; fi
          curl -fsSL "$URL" -o pub.download
          mkdir -p binout
          if file pub.download | grep -qi 'gzip\|tar'; then
            tar -xzf pub.download -C binout || tar -xf pub.download -C binout
          else
            cp pub.download binout/mcp-publisher
          fi
          BIN=$(find binout -type f -name 'mcp-publisher*' | head -1)
          [ -z "$BIN" ] && BIN=$(find binout -type f -perm -u+x | head -1)
          [ -z "$BIN" ] && BIN=$(find binout -type f | head -1)
          echo "binary: $BIN"
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/mcp-publisher
          mcp-publisher --help 2>&1 | head -3 || true

      - name: Build server.json
        run: |
          set -e
          mcp-publisher init || true
          SCHEMA=$(jq -r '."$schema" // "https://static.modelcontextprotocol.io/schemas/2025-07-09/server.schema.json"' server.json 2>/dev/null || echo "https://static.modelcontextprotocol.io/schemas/2025-07-09/server.schema.json")
          jq -n --arg s "$SCHEMA" '{
            "$schema": $s,
            name: "pro.sebbi/governance",
            description: "Score, seal and prove any AI decision, and timestamp it into Bitcoin - checkable by anyone, without trusting us.",
            version: "1.0.0",
            remotes: [ { type: "streamable-http", url: "https://sebbi.pro/mcp" } ]
          }' > server.json
          echo "----- server.json -----"; cat server.json

      - name: Log in (domain HTTP auth)
        run: mcp-publisher login http --domain=sebbi.pro --private-key="${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"

      - name: Publish
        run: mcp-publisher publish
